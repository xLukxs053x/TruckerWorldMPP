[project]
name = "truckerworldmp-discord-bot"
version = "1.0.0"
description = "Discord community and platform bot for TruckerWorldMP"
requires-python = ">=3.10"
dependencies = [
  "discord.py==2.7.1",
  "aiohttp==3.14.3",
  "aiosqlite==0.22.1",
  "python-dotenv==1.2.2",
  "reportlab==5.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["E501"]
